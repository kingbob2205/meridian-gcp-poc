steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - GIT_SHA=${_GIT_SHA}
      - -t
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
substitutions:
  _GIT_SHA: unknown
  _IMAGE_URI: europe-west3-docker.pkg.dev/meridian-gcp-poc-ho26/meridian-api/api:latest
options:
  logging: CLOUD_LOGGING_ONLY
